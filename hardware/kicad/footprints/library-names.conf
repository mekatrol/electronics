# Bash variables shared by setup-kicad-libs.sh and teardown-kicad-libs.sh.
# Edit the values on the right to choose library nicknames.
# Keys are repository directory names and should match the .pretty folders.
# New directories without an entry default to their name without .pretty.
declare -A LIBRARY_NAMES=(
    [ESP32_board.pretty]="ESP32_board"
    [Extra.pretty]="Extra"
    [MCU_RaspberryPi_and_Boards.pretty]="MCU_RaspberryPi_and_Boards"
    [Mekatrol_Footprints.pretty]="Mekatrol_Footprints"
    [Segmentum.pretty]="Segmentum"
    [Toponelec_TY308.pretty]="Connectors"
)
