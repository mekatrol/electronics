[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kicad-tools-app"
version = "0.2.0"
description = "Local FastAPI backend for approved KiCad helper tools."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "jsonschema>=4.18,<5",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
kicad-tools-app = "kicad_tools_app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_tools_app"]

[tool.hatch.build.targets.wheel.force-include]
"src/kicad_tools_app/static" = "kicad_tools_app/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kicad_tools_app"]

